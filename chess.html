<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="chess">
    <div class="container">
        <div class="game">
            <div class="top-bar">
                <div class="player" id="pWhite">
                    <span class="score name">БЕЛЫЕ</span>
                </div>
            </div>

            <div class="status" id="status"></div>
            <div class="chess-board" id="chessboard"></div>

            <div class="buttons row">
                <button class="btn btn-blue" id="restart">ЗАНОВО</button>
                <a class="btn btn-orange" href="index.html">МЕНЮ</a>
            </div>
        </div>
    </div>

    <div class="overlay" id="promo" hidden>
        <div class="overlay-box">
            <div class="big-text">Превращение пешки</div>
            <div class="promo-choices" id="promoChoices"></div>
        </div>
    </div>

    <div class="overlay" id="end" hidden>
        <div class="overlay-box">
            <div class="big-text" id="endText"></div>
            <div class="buttons">
                <button class="btn btn-blue" onclick="document.getElementById('restart').click()">ЗАНОВО</button>
                <a class="btn btn-orange" href="index.html">МЕНЮ</a>
            </div>
        </div>
    </div>

    <script src="guard.js"></script>
    <script src="chess.js"></script>
</body>
</html>
